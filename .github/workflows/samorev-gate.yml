name: samorev gate

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  statuses: read

jobs:
  samorev-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require exact-head samorev success
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in $(seq 1 28); do
            state="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/status" --jq '.statuses[] | select(.context == "samorev") | .state' | head -1)"
            if [ "$state" = success ]; then
              echo "samorev passed on exact head $HEAD_SHA"
              exit 0
            fi
            if [ "$state" = failure ] || [ "$state" = error ]; then
              echo "samorev failed on exact head $HEAD_SHA"
              exit 1
            fi
            sleep 30
          done
          echo "samorev did not pass on exact head $HEAD_SHA within 14 minutes"
          exit 1
