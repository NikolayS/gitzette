name: samorev gate

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: samorev-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  samorev-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an exact-head samorev status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Branch protection independently requires this exact status to be
          # success. This PR-triggered check verifies the status is attached to
          # the current head without creating a circular wait during review.
          for attempt in $(seq 1 4); do
            status="$(gh api "repos/$REPOSITORY/statuses/$HEAD_SHA" --jq '[.[] | select(.context == "samorev")][0] // {}')"
            state="$(jq -r '.state // empty' <<<"$status")"
            creator="$(jq -r '.creator.login // empty' <<<"$status")"
            if [ -n "$state" ] && [ "$creator" != "NikolayS" ]; then
              echo "samorev status has unexpected creator: $creator"
              exit 1
            fi
            if [ "$state" = pending ] || [ "$state" = success ]; then
              echo "samorev status exists on exact head $HEAD_SHA ($state by $creator)"
              exit 0
            fi
            if [ "$state" = failure ] || [ "$state" = error ]; then
              echo "samorev failed on exact head $HEAD_SHA"
              exit 1
            fi
            sleep 30
          done
          echo "samorev status was not attached to exact head $HEAD_SHA"
          exit 1
