name: samorev gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: samorev-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  samorev-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require an exact-head samorev status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # This GitHub-Actions check is the protected gate. It waits for the
          # external exact-head verdict and accepts success only when the latest
          # status was created by the authorized owner account.
          for attempt in $(seq 1 60); do
            echo "samorev verdict poll $attempt/60"
            status="$(gh api "repos/$REPOSITORY/statuses/$HEAD_SHA" --jq '[.[] | select(.context == "samorev")][0] // {}')"
            state="$(jq -r '.state // empty' <<<"$status")"
            creator="$(jq -r '.creator.login // empty' <<<"$status")"
            if [ -n "$state" ] && [ "$creator" != "NikolayS" ]; then
              echo "samorev status has unexpected creator: $creator"
              exit 1
            fi
            if [ "$state" = success ]; then
              echo "samorev passed on exact head $HEAD_SHA by $creator"
              exit 0
            fi
            if [ "$state" = failure ] || [ "$state" = error ]; then
              echo "samorev failed on exact head $HEAD_SHA"
              exit 1
            fi
            sleep 30
          done
          echo "samorev did not reach a final verdict on exact head $HEAD_SHA"
          exit 1
