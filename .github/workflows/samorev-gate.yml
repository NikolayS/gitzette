name: samorev gate

# Security boundary: pull_request_target loads this workflow from protected
# main, never from the untrusted PR head. Keep permissions read-only.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: samorev-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  publish-samorev-gate:
    name: base-controlled samorev publisher
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Require the owner-published exact-head verdict
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          publish_gate() {
            gh api --method POST "repos/$REPOSITORY/statuses/$HEAD_SHA" \
              -f state="$1" -f context=samorev-gate \
              -f description="$2" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          }
          publish_gate pending "Waiting for the exact-head samorev verdict"
          if [ "$IS_DRAFT" = true ]; then
            publish_gate failure "Draft PRs are not eligible for review"
            exit 1
          fi
          if [ ! -f scripts/evaluate-samorev-status.sh ]; then
            publish_gate error "Base-branch samorev evaluator is missing"
            exit 1
          fi
          api_failures=0
          for attempt in $(seq 1 60); do
            echo "samorev verdict poll $attempt/60"
            if ! statuses="$(gh api --paginate --slurp "repos/$REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100")"; then
              echo "transient GitHub status API failure; retrying"
              api_failures=$((api_failures + 1))
              if [ "$api_failures" -ge 3 ]; then
                echo "GitHub status API failed three consecutive times; aborting" >&2
                publish_gate error "GitHub status API failed three consecutive times"
                exit 1
              fi
              if [ "$attempt" -lt 60 ]; then
                sleep 30
              fi
              continue
            fi
            api_failures=0
            verdict_rc=0
            bash scripts/evaluate-samorev-status.sh <<<"$statuses" || verdict_rc=$?
            case "$verdict_rc" in
              0)
                publish_gate success "Owner-published samorev verdict passed"
                exit 0
                ;;
              1|3)
                publish_gate failure "samorev verdict failed identity or outcome validation"
                exit 1
                ;;
              2) ;;
              *)
                publish_gate error "samorev verdict evaluator failed unexpectedly"
                exit 1
                ;;
            esac
            if [ "$attempt" -lt 60 ]; then
              sleep 30
            fi
          done
          echo "samorev did not reach a final verdict on exact head $HEAD_SHA"
          publish_gate failure "samorev did not finish within 30 minutes"
          exit 1
