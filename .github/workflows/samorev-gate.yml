name: samorev gate

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  statuses: read

jobs:
  samorev-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require an exact-head samorev status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Branch protection independently requires this exact status to be
          # success. This PR-triggered check verifies the status is attached to
          # the current head without creating a circular wait during review.
          for attempt in $(seq 1 4); do
            state="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/status" --jq '.statuses[] | select(.context == "samorev") | .state' | head -1)"
            if [ "$state" = pending ] || [ "$state" = success ]; then
              echo "samorev status exists on exact head $HEAD_SHA ($state)"
              exit 0
            fi
            if [ "$state" = failure ] || [ "$state" = error ]; then
              echo "samorev failed on exact head $HEAD_SHA"
              exit 1
            fi
            sleep 30
          done
          echo "samorev status was not attached to exact head $HEAD_SHA"
          exit 1
