name: samorev gate

# Security boundary: pull_request_target loads this workflow from protected
# main, never from the untrusted PR head. Keep permissions read-only.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: samorev-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  samorev-gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require the owner-published exact-head verdict
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          # NikolayS; verified with: gh api users/NikolayS --jq .id
          REVIEWER_ID: "1345402"
        run: |
          api_failures=0
          for attempt in $(seq 1 60); do
            echo "samorev verdict poll $attempt/60"
            if ! status="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/status" --jq '[.statuses[] | select(.context == "samorev")][0] // {}')"; then
              echo "transient GitHub status API failure; retrying"
              api_failures=$((api_failures + 1))
              if [ "$api_failures" -ge 3 ]; then
                echo "GitHub status API failed three consecutive times; aborting" >&2
                exit 1
              fi
              sleep 30
              continue
            fi
            api_failures=0
            state="$(jq -r '.state // empty' <<<"$status")"
            creator_id="$(jq -r '.creator.id // empty' <<<"$status")"
            creator="$(jq -r '.creator.login // empty' <<<"$status")"
            if [ -n "$state" ] && [ "$creator_id" != "$REVIEWER_ID" ]; then
              echo "samorev status has unexpected creator: $creator ($creator_id)"
              exit 1
            fi
            if [ "$state" = success ]; then
              echo "samorev passed on exact head $HEAD_SHA by $creator"
              exit 0
            fi
            if [ "$state" = failure ] || [ "$state" = error ]; then
              echo "samorev failed on exact head $HEAD_SHA"
              exit 1
            fi
            sleep 30
          done
          echo "samorev did not reach a final verdict on exact head $HEAD_SHA"
          exit 1
