name: Migrate production credential scope

# One-shot bootstrap. Delete this workflow immediately after the repository
# Cloudflare secrets have been copied to the protected production environment.
on:
  workflow_dispatch:
    inputs:
      rsa_public_key_pem_b64:
        description: Base64-encoded RSA public key for the one-shot encrypted export
        required: true
        type: string

permissions:
  contents: read

jobs:
  export-encrypted-credentials:
    if: github.actor == 'NikolayS'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Export only public-key-encrypted credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RSA_PUBLIC_KEY_PEM_B64: ${{ inputs.rsa_public_key_pem_b64 }}
        run: |
          set -euo pipefail
          umask 077
          migration_dir="$(mktemp -d)"
          trap 'rm -rf "$migration_dir"' EXIT
          if [[ ${#RSA_PUBLIC_KEY_PEM_B64} -gt 16384 ]]; then
            echo "public key input is too large" >&2
            exit 1
          fi
          printf '%s' "$RSA_PUBLIC_KEY_PEM_B64" | base64 --decode >"$migration_dir/public.pem"
          openssl pkey -pubin -in "$migration_dir/public.pem" -noout
          public_key_fingerprint="$(
            openssl pkey -pubin -in "$migration_dir/public.pem" -outform DER |
              sha256sum | awk '{print $1}'
          )"
          if [[ "$public_key_fingerprint" != "7067899ede540031e13351ac29297fa51c0dc975f9ed2702d1c4dfe937299cdc" ]]; then
            echo "public key fingerprint does not match the reviewed migration key" >&2
            exit 1
          fi
          jq -n \
            --arg account_id "$CLOUDFLARE_ACCOUNT_ID" \
            --arg api_token "$CLOUDFLARE_API_TOKEN" \
            '{CLOUDFLARE_ACCOUNT_ID:$account_id,CLOUDFLARE_API_TOKEN:$api_token}' \
            >"$migration_dir/credentials.json"
          openssl pkeyutl -encrypt -pubin -inkey "$migration_dir/public.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$migration_dir/credentials.json" -out "$migration_dir/credentials.bin"
          printf 'encrypted_credentials=%s\n' "$(base64 -w0 "$migration_dir/credentials.bin")"
