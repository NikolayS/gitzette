name: Migrate production credential scope
run-name: 'credential migration: ${{ inputs.operation }}'

# One-shot bootstrap. Follow docs/credential-migration.md and delete this
# workflow immediately after the repository credentials have been migrated.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Export repository credentials or verify production environment copies
        required: true
        type: choice
        options: [export, verify]

permissions: {}

concurrency:
  group: credential-migration
  cancel-in-progress: false

jobs:
  authorize-export:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the dedicated dispatcher and open migration window
        env:
          DISPATCHER_ID: ${{ github.event.sender.id }}
          DISPATCH_REF: ${{ github.ref }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          OPERATION: ${{ inputs.operation }}
          EXPORT_OPEN: ${{ vars.CREDENTIAL_EXPORT_OPEN }}
          VERIFY_OPEN: ${{ vars.CREDENTIAL_VERIFY_OPEN }}
          BOOTSTRAP_EXPIRES_AT: 2026-08-27T00:00:00Z
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          deadline_epoch="$(date -u -d "$BOOTSTRAP_EXPIRES_AT" +%s)"
          if (( now_epoch >= deadline_epoch )); then
            echo "credential migration bootstrap deadline expired" >&2
            exit 1
          fi
          if [[ "$DISPATCHER_ID" != "280144521" ]]; then
            echo "credential migration must be dispatched by samo-agent" >&2
            exit 1
          fi
          run_metadata="$(curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 20 --config - \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            <<<"header = \"Authorization: Bearer $GH_TOKEN\"")"
          triggering_actor_id="$(jq -er .triggering_actor.id <<<"$run_metadata")"
          if [[ "$triggering_actor_id" != "280144521" ]]; then
            echo "credential migration triggering actor has the wrong immutable ID" >&2
            exit 1
          fi
          case "$OPERATION" in
            export)
              if [[ "$EXPORT_OPEN" != "true" ]]; then
                echo "CREDENTIAL_EXPORT_OPEN must be exactly true" >&2
                exit 1
              fi
              if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
                echo "credential export must run from refs/heads/main" >&2
                exit 1
              fi
              ;;
            verify)
              if [[ "$VERIFY_OPEN" != "true" ]]; then
                echo "CREDENTIAL_VERIFY_OPEN must be exactly true" >&2
                exit 1
              fi
              if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
                echo "credential verification must run from protected main" >&2
                exit 1
              fi
              ;;
            *)
              echo "credential migration operation must be export or verify" >&2
              exit 1
              ;;
          esac
          if [[ "$RUN_ATTEMPT" != "1" ]]; then
            echo "credential migration does not permit workflow reruns" >&2
            exit 1
          fi
          main_sha="$(curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 20 --config - \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" \
            <<<"header = \"Authorization: Bearer $GH_TOKEN\"" | jq -er .sha)"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "credential migration run must resolve to the current protected main tip" >&2
            exit 1
          fi

  export-encrypted-credentials:
    needs: authorize-export
    if: ${{ inputs.operation == 'export' }}
    environment: credential-migration
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Revalidate authorization on every export attempt
        env:
          DISPATCHER_ID: ${{ github.event.sender.id }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MIGRATION_OPEN: ${{ vars.CREDENTIAL_EXPORT_OPEN }}
          BOOTSTRAP_EXPIRES_AT: 2026-08-27T00:00:00Z
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          deadline_epoch="$(date -u -d "$BOOTSTRAP_EXPIRES_AT" +%s)"
          if (( now_epoch >= deadline_epoch )); then
            echo "credential migration bootstrap deadline expired" >&2
            exit 1
          fi
          if [[ "$DISPATCHER_ID" != "280144521" ||
                "$DISPATCH_REF" != "refs/heads/main" || "$RUN_ATTEMPT" != "1" ||
                "$MIGRATION_OPEN" != "true" ]]; then
            echo "credential migration authorization is no longer valid" >&2
            exit 1
          fi
          triggering_actor_id="$(curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 20 --config - \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            <<<"header = \"Authorization: Bearer $GH_TOKEN\"" | jq -er .triggering_actor.id)"
          if [[ "$triggering_actor_id" != "280144521" ]]; then
            echo "credential migration triggering actor has the wrong immutable ID" >&2
            exit 1
          fi
          main_sha="$(curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 20 --config - \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" \
            <<<"header = \"Authorization: Bearer $GH_TOKEN\"" | jq -er .sha)"
          if [[ "$DISPATCH_SHA" != "$main_sha" ]]; then
            echo "credential export run is no longer the current protected main tip" >&2
            exit 1
          fi
          approval_history="$(curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 20 --config - \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            <<<"header = \"Authorization: Bearer $GH_TOKEN\"")"
          jq -e 'any(.[]; .state == "approved" and .user.id == 1345402 and
            any(.environments[]; .name == "credential-migration"))' \
            <<<"$approval_history" >/dev/null || {
              echo "credential migration lacks the reviewed Nik approval" >&2
              exit 1
            }
      - name: Export encrypted credentials to dedicated D1 transfer storage
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRANSFER_DATABASE_NAME: gitzette-credential-transfer-2026-08
          RSA_PUBLIC_KEY_PEM_B64: 
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "both Cloudflare repository secrets must be present" >&2
            exit 1
          fi
          if [[ "$CLOUDFLARE_ACCOUNT_ID" != "a3265e0d0db71fdece29365819452f00" ]]; then
            echo "repository account ID is not the reviewed Worker account" >&2
            exit 1
          fi
          migration_dir="$RUNNER_TEMP/gitzette-credential-migration"
          mkdir -p "$migration_dir"
          printf '%s' "$RSA_PUBLIC_KEY_PEM_B64" | base64 --decode >"$migration_dir/public.pem"
          openssl pkey -pubin -in "$migration_dir/public.pem" -noout
          public_key_fingerprint="$(
            openssl pkey -pubin -in "$migration_dir/public.pem" -outform DER |
              sha256sum | awk '{print $1}'
          )"
          # Self-consistency aid only. The approver independently compares this
          # reviewed fingerprint with the operator-held private key before approval.
          if [[ "$public_key_fingerprint" != "7067899ede540031e13351ac29297fa51c0dc975f9ed2702d1c4dfe937299cdc" ]]; then
            echo "public key fingerprint does not match the reviewed migration key" >&2
            exit 1
          fi
          jq -n \
            '{CLOUDFLARE_ACCOUNT_ID:env.CLOUDFLARE_ACCOUNT_ID,CLOUDFLARE_API_TOKEN:env.CLOUDFLARE_API_TOKEN}' |
          openssl pkeyutl -encrypt -pubin -inkey "$migration_dir/public.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 \
            -out "$migration_dir/credentials.bin"
          ciphertext="$(base64 -w0 "$migration_dir/credentials.bin")"
          jq -n --arg name "$TRANSFER_DATABASE_NAME" '{name:$name}' >"$migration_dir/create-database.json"
          # The database is deliberately created by this one-shot export and is
          # never bound to the Worker. Do not retry: a lost success response is
          # recovered by listing this exact name and inspecting its marker.
          database_id="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 --config - \
            -H 'Content-Type: application/json' \
            --data-binary "@$migration_dir/create-database.json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
            <<<"header = \"Authorization: Bearer $CLOUDFLARE_API_TOKEN\"" |
            jq -er --arg name "$TRANSFER_DATABASE_NAME" '
              select(.success == true) | .result |
              select(.name == $name and (.uuid | type == "string") and
                (.uuid | test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))) | .uuid')"
          if [[ "$database_id" == "4a3624d7-7de8-46d5-91f5-7ee79856ccaa" ]]; then
            echo "dedicated transfer database resolved to the Worker-bound database" >&2
            exit 1
          fi
          # Cloudflare D1 /query accepts a MultipleQueries body. Each statement
          # carries its own parameters; no transactional rollback is assumed.
          # A pre-existing table makes the create fail closed. The insert is
          # independently guarded because D1 batch continuation is not assumed.
          # https://developers.cloudflare.com/api/resources/d1/subresources/database/methods/query/
          CIPHERTEXT="$ciphertext" jq -n '{batch: [
            {sql: "create table credential_migration_transfer (run_id text primary key, ciphertext text not null, created_at text not null)"},
            {sql: "insert into credential_migration_transfer(run_id,ciphertext,created_at) select ?1,?2,datetime(\u0027now\u0027) where not exists (select 1 from credential_migration_transfer)", params: [env.GITHUB_RUN_ID, env.CIPHERTEXT]}
          ]}' >"$migration_dir/d1-request.json"
          # Do not retry this non-idempotent POST: a lost success response must
          # be recovered by querying the consumed-once marker, never replayed.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 --config - \
            -H 'Content-Type: application/json' \
            --data-binary "@$migration_dir/d1-request.json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$database_id/query" \
            <<<"header = \"Authorization: Bearer $CLOUDFLARE_API_TOKEN\"" |
            jq -e '.success == true and (.result | length == 2) and
              all(.result[]; .success == true) and .result[1].meta.changes == 1' >/dev/null
      - name: Remove local migration material
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/gitzette-credential-migration"

  verify-production-credentials:
    needs: authorize-export
    if: ${{ inputs.operation == 'verify' }}
    environment: production
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require the reviewed production approval
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHER_ID: ${{ github.event.sender.id }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MIGRATION_OPEN: ${{ vars.CREDENTIAL_VERIFY_OPEN }}
          BOOTSTRAP_EXPIRES_AT: 2026-08-27T00:00:00Z
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          deadline_epoch="$(date -u -d "$BOOTSTRAP_EXPIRES_AT" +%s)"
          if (( now_epoch >= deadline_epoch )); then
            echo "credential migration bootstrap deadline expired" >&2
            exit 1
          fi
          if [[ "$DISPATCHER_ID" != "280144521" ||
                "$DISPATCH_REF" != "refs/heads/main" || "$RUN_ATTEMPT" != "1" ||
                "$MIGRATION_OPEN" != "true" ]]; then
            echo "production credential verification authorization is no longer valid" >&2
            exit 1
          fi
          triggering_actor_id="$(curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 20 --config - \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            <<<"header = \"Authorization: Bearer $GH_TOKEN\"" | jq -er .triggering_actor.id)"
          if [[ "$triggering_actor_id" != "280144521" ]]; then
            echo "production verification triggering actor has the wrong immutable ID" >&2
            exit 1
          fi
          main_sha="$(curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 20 --config - \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" \
            <<<"header = \"Authorization: Bearer $GH_TOKEN\"" | jq -er .sha)"
          if [[ "$DISPATCH_SHA" != "$main_sha" ]]; then
            echo "production verification run is no longer the current protected main tip" >&2
            exit 1
          fi
          approval_history="$(curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 20 --config - \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            <<<"header = \"Authorization: Bearer $GH_TOKEN\"")"
          jq -e 'any(.[]; .state == "approved" and .user.id == 1345402 and
            any(.environments[]; .name == "production"))' \
            <<<"$approval_history" >/dev/null || {
              echo "production verification lacks the reviewed Nik approval" >&2
              exit 1
            }
      - name: Verify stored environment credentials against the exact Worker account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "both production environment credentials must be present" >&2
            exit 1
          fi
          if [[ "$CLOUDFLARE_ACCOUNT_ID" != "a3265e0d0db71fdece29365819452f00" ]]; then
            echo "production account ID is not the reviewed Worker account" >&2
            exit 1
          fi
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --config - \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/gitzette" \
            <<<"header = \"Authorization: Bearer $CLOUDFLARE_API_TOKEN\"" |
            jq -e '.success == true' >/dev/null
