name: Credential migration switch guard

# Separate from policy drift so an expected open-switch failure cannot mask the
# first production or migration policy regression.
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  migration-switches:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the canonical repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "NikolayS/gitzette" ]] || {
            echo "credential migration switch guard must run in the canonical repository" >&2
            exit 1
          }
      - name: Fail if a credential migration switch remains open
        # vars.* is resolved by GitHub before the job starts; this job does not
        # call variable/secret inventory APIs with GITHUB_TOKEN.
        env:
          EXPORT_OPEN: ${{ vars.CREDENTIAL_EXPORT_OPEN }}
          VERIFY_OPEN: ${{ vars.CREDENTIAL_VERIFY_OPEN }}
        run: |
          set -euo pipefail
          if [[ -n "$EXPORT_OPEN" || -n "$VERIFY_OPEN" ]]; then
            echo "a credential migration switch remains defined" >&2
            exit 1
          fi
