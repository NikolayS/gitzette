name: Credential migration policy guard

# Temporary bootstrap guard. Delete with the migration workflow after the
# environment-secret migration is complete.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  production-policy:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the canonical repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "NikolayS/gitzette" ]] || {
            echo "credential migration guard must run in the canonical repository" >&2
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Audit the fixed production ref policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          bash scripts/check-production-environment.sh
          checker_status=$?
          set -e
          if [[ "$checker_status" -eq 3 ]]; then
            echo "GUARD UNREADABLE: production environment API evidence could not be retrieved" >&2
            exit 3
          fi
          if [[ "$checker_status" -eq 4 ]]; then
            echo "CRITICAL: production environment is missing; recreate it non-bypassable before any deploy" >&2
            exit 4
          fi
          if [[ "$checker_status" -ne 0 ]]; then
            echo "CRITICAL: production no longer admits exactly protected main and release tags; reapply the reviewed policy immediately" >&2
            exit 1
          fi
  migration-policy:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the canonical repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "NikolayS/gitzette" ]] || {
            echo "credential migration guard must run in the canonical repository" >&2
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Audit the credential migration approval boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          bash scripts/check-credential-migration-environment.sh
          checker_status=$?
          set -e
          if [[ "$checker_status" -eq 3 ]]; then
            echo "GUARD UNREADABLE: credential-migration environment API evidence could not be retrieved" >&2
            exit 3
          fi
          if [[ "$checker_status" -eq 4 ]]; then
            echo "CRITICAL: credential-migration environment is missing; recreate it non-bypassable before export" >&2
            exit 4
          fi
          if [[ "$checker_status" -ne 0 ]]; then
            echo "CRITICAL: credential-migration no longer requires Nik-only approval with self-review blocked" >&2
            exit 1
          fi

  migration-switches:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the canonical repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "NikolayS/gitzette" ]] || {
            echo "credential migration guard must run in the canonical repository" >&2
            exit 1
          }
      - name: Fail if a credential migration switch remains open
        # vars.* is resolved by GitHub before the job starts; this job does not
        # call variable/secret inventory APIs with GITHUB_TOKEN.
        env:
          EXPORT_OPEN: ${{ vars.CREDENTIAL_EXPORT_OPEN }}
          VERIFY_OPEN: ${{ vars.CREDENTIAL_VERIFY_OPEN }}
        run: |
          set -euo pipefail
          if [[ -n "$EXPORT_OPEN" || -n "$VERIFY_OPEN" ]]; then
            echo "a credential migration switch remains defined" >&2
            exit 1
          fi

  bootstrap-deadline:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the canonical repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "NikolayS/gitzette" ]] || {
            echo "credential migration guard must run in the canonical repository" >&2
            exit 1
          }
      - name: Enforce the credential bootstrap deadline
        env:
          BOOTSTRAP_EXPIRES_AT: 2026-08-27T00:00:00Z
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          deadline_epoch="$(date -u -d "$BOOTSTRAP_EXPIRES_AT" +%s)"
          if (( now_epoch >= deadline_epoch )); then
            echo "CRITICAL: credential bootstrap deadline expired; complete teardown immediately" >&2
            exit 1
          fi
