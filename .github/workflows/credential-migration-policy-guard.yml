name: Credential migration policy guard

# Temporary bootstrap guard. Delete with the migration workflow after the
# environment-secret migration is complete.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  production-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the canonical repository
        env:
          REPOSITORY: ${{ github.repository }}
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "NikolayS/gitzette" && "$IS_FORK" == "false" ]] || {
            echo "credential migration guard must run in the canonical repository" >&2
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fail if temporary production widening lingers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-production-environment.sh default
