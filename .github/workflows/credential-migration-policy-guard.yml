name: Credential migration policy guard

# Temporary bootstrap guard. Delete with the migration workflow after the
# environment-secret migration is complete.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-policy:
    if: ${{ github.repository == 'NikolayS/gitzette' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fail if temporary production widening lingers
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-production-environment.sh default
