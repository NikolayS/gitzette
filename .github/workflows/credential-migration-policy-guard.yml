name: Credential migration policy guard

# Temporary bootstrap guard. Delete with the migration workflow after the
# environment-secret migration is complete.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  production-policy:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the canonical repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "NikolayS/gitzette" ]] || {
            echo "credential migration guard must run in the canonical repository" >&2
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fail if temporary production widening lingers
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OPEN: ${{ vars.CREDENTIAL_VERIFY_OPEN }}
        run: |
          set -euo pipefail
          case "$VERIFY_OPEN" in
            '') expected_mode=default ;;
            true) expected_mode=migration ;;
            *)
              echo "CREDENTIAL_VERIFY_OPEN must be empty or exactly true" >&2
              exit 1
              ;;
          esac
          set +e
          bash scripts/check-production-environment.sh "$expected_mode"
          checker_status=$?
          set -e
          if [[ "$checker_status" -eq 3 ]]; then
            echo "GUARD UNREADABLE: production environment API evidence could not be retrieved" >&2
            exit 3
          fi
          if [[ "$checker_status" -ne 0 ]]; then
            if [[ "$expected_mode" == default ]]; then
              echo "CRITICAL: production is not v*-only after the verification switch closed; reapply the default policy immediately" >&2
            else
              echo "CRITICAL: production migration policy drifted during the verification window" >&2
            fi
            exit 1
          fi

  migration-switches:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the canonical repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "NikolayS/gitzette" ]] || {
            echo "credential migration guard must run in the canonical repository" >&2
            exit 1
          }
      - name: Fail if a credential migration switch remains open
        env:
          EXPORT_OPEN: ${{ vars.CREDENTIAL_EXPORT_OPEN }}
          VERIFY_OPEN: ${{ vars.CREDENTIAL_VERIFY_OPEN }}
        run: |
          set -euo pipefail
          if [[ -n "$EXPORT_OPEN" || -n "$VERIFY_OPEN" ]]; then
            echo "a credential migration switch remains defined" >&2
            exit 1
          fi
