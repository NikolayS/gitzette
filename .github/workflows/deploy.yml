name: Deploy

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  review-gate:
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the reviewed current main merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "release tag must point to the current main tip" >&2
            exit 1
          fi

          pulls="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"
          reviewed_pr="$(jq -c --arg sha "$GITHUB_SHA" '[.[] | select(.base.ref == "main" and .merged_at != null and .merge_commit_sha == $sha)][0] // {}' <<<"$pulls")"
          reviewed_sha="$(jq -r '.head.sha // empty' <<<"$reviewed_pr")"
          if [ -z "$reviewed_sha" ]; then
            echo "release commit is not a merged, reviewed main PR" >&2
            exit 1
          fi

          check_runs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$reviewed_sha/check-runs?filter=latest&per_page=100")"
          if ! jq -e 'any(.check_runs[]; .name == "typecheck" and .conclusion == "success" and .app.id == 15368)' <<<"$check_runs" >/dev/null; then
            echo "reviewed head lacks successful app-bound typecheck" >&2
            exit 1
          fi
          if ! jq -e 'any(.check_runs[]; .name == "base-controlled samorev publisher" and .conclusion == "success" and .app.id == 15368)' <<<"$check_runs" >/dev/null; then
            echo "reviewed head lacks successful app-bound samorev publisher" >&2
            exit 1
          fi

          statuses="$(gh api "repos/$GITHUB_REPOSITORY/commits/$reviewed_sha/statuses?per_page=100")"
          if ! jq -e '
            (map(select(.context == "samorev")) | sort_by(.created_at, .id) | last) as $samorev |
            (map(select(.context == "samorev-gate")) | sort_by(.created_at, .id) | last) as $gate |
            $samorev.state == "success" and $samorev.creator.id == 280144521 and
            $gate.state == "success"
          ' <<<"$statuses" >/dev/null; then
            echo "reviewed head lacks the CODEOWNER samorev verdict or base-controlled gate" >&2
            exit 1
          fi

  deploy:
    needs: review-gate
    environment: production
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Verify required Worker secrets
        run: bash scripts/check-production-secrets.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify weekly profile activation prerequisites
        run: bash scripts/check-weekly-profiles.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production drift and apply migrations
        run: bun run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Re-assert the live schema before deploying the Worker
        run: bash scripts/check-production-schema.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy only after secrets, migrations, and live schema verification
        run: ./node_modules/.bin/wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
