name: Deploy

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  review-gate:
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the reviewed current main merge
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PUSHER_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          triggering_actor_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .triggering_actor.id)"
          bash scripts/check-release-tag-actor.sh "$TAG_PUSHER_ID" "$triggering_actor_id"
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "release tag must point to the current main tip" >&2
            exit 1
          fi

          pulls="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"
          reviewed_pr="$(jq -c --arg sha "$GITHUB_SHA" '[.[] | select(.base.ref == "main" and .merged_at != null and .merge_commit_sha == $sha)][0] // {}' <<<"$pulls")"
          reviewed_sha="$(jq -r '.head.sha // empty' <<<"$reviewed_pr")"
          if [ -z "$reviewed_sha" ]; then
            echo "release commit is not a merged, reviewed main PR" >&2
            exit 1
          fi

          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            bash scripts/check-release-review-evidence.sh "$reviewed_sha"

  deploy:
    needs: review-gate
    environment: production
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Verify required Worker secrets
        run: bash scripts/check-production-secrets.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify weekly profile activation prerequisites
        run: bash scripts/check-weekly-profiles.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production drift and apply migrations
        run: bun run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Temporary bootstrap flag; removed by #67 after credential migration.
          CREDENTIAL_MIGRATION_IN_PROGRESS: true
      - name: Re-assert the live schema before deploying the Worker
        run: bash scripts/check-production-schema.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Temporary bootstrap flag; removed by #67 after credential migration.
          CREDENTIAL_MIGRATION_IN_PROGRESS: true
      - name: Deploy only after secrets, migrations, and live schema verification
        run: ./node_modules/.bin/wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
