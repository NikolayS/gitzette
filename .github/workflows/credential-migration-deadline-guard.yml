name: Credential migration deadline guard

# Separate from policy and switch drift so expiry cannot mask a new regression.
on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  bootstrap-deadline:
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the canonical repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "NikolayS/gitzette" ]] || {
            echo "credential migration deadline guard must run in the canonical repository" >&2
            exit 1
          }
      - name: Enforce the credential bootstrap deadline
        env:
          BOOTSTRAP_EXPIRES_AT: 2026-08-27T00:00:00Z
        run: |
          set -euo pipefail
          now_epoch="$(date -u +%s)"
          deadline_epoch="$(date -u -d "$BOOTSTRAP_EXPIRES_AT" +%s)"
          if (( now_epoch >= deadline_epoch )); then
            echo "CRITICAL: credential bootstrap deadline expired; the live production policy is not narrowed automatically" >&2
            echo "run scripts/apply-production-environment.sh --restore-baseline immediately, then complete teardown" >&2
            exit 1
          fi
