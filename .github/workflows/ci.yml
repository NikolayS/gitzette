name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  policy-api-readability:
    permissions:
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Prove policy guard API readability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/production" \
            --jq 'has("can_admins_bypass")' | grep -qx true
          gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies?per_page=1" >/dev/null
          environments="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/environments?per_page=100" |
            jq -c 'map(.environments) | add // []')"
          if jq -e 'any(.[]; .name == "credential-migration")' <<<"$environments" >/dev/null; then
            migration_environment="$(gh api \
              "repos/$GITHUB_REPOSITORY/environments/credential-migration")"
            jq -e 'has("can_admins_bypass")' <<<"$migration_environment" >/dev/null
            if [[ "$(jq -r .deployment_branch_policy.custom_branch_policies \
              <<<"$migration_environment")" == true ]]; then
              gh api "repos/$GITHUB_REPOSITORY/environments/credential-migration/deployment-branch-policies?per_page=1" >/dev/null
            fi
          fi

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install image validation runtime
        run: |
          # GitHub's Azure mirror can stall indefinitely; rewrite every apt source shape used by runner images.
          mapfile -t apt_sources < <(find /etc/apt -type f \( -name 'apt-mirrors.txt' -o -name 'sources.list' -o -name '*.sources' -o -name '*.list' \) -print)
          if [[ "${#apt_sources[@]}" -eq 0 ]]; then
            echo "no apt source files found" >&2
            exit 1
          fi
          for apt_source in "${apt_sources[@]}"; do
            sudo sed -Ei 's#https?://([a-z0-9.-]*\.)?azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$apt_source"
          done
          if sudo grep -HEq 'azure\.archive\.ubuntu\.com' "${apt_sources[@]}"; then
            echo "Azure Ubuntu mirror rewrite did not take effect" >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick=8:6.9.12.98+dfsg1-5.2build2 \
            imagemagick-6.q16=8:6.9.12.98+dfsg1-5.2build2
          sudo install -o root -g root -m 0644 runner/imagemagick/policy.xml /etc/ImageMagick-6/policy.xml
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify systemd Bun invocation flag
        run: bun --no-env-file --version
      - name: Validate protected-main policy definition
        run: >-
          jq -e '.required_status_checks.strict == true and
          (.required_status_checks.checks | sort_by(.context)) ==
          [{"context":"policy-api-readability","app_id":15368},{"context":"samorev","app_id":null},{"context":"samorev-gate","app_id":15368},{"context":"typecheck","app_id":15368}] and
          .enforce_admins == true and .required_conversation_resolution == true and
          .required_pull_request_reviews.require_code_owner_reviews == false and
          .required_pull_request_reviews.required_approving_review_count == 0 and
          .required_pull_request_reviews.require_last_push_approval == false and
          (.repository_rulesets | length) == 2 and
          .repository_rulesets[0].name == "main-samo-only-updates" and
          .repository_rulesets[0].target == "branch" and
          .repository_rulesets[0].enforcement == "active" and
          .repository_rulesets[0].bypass_actors == [{"actor_id":280144521,"actor_type":"User","bypass_mode":"always"}] and
          .repository_rulesets[0].conditions.ref_name == {"exclude":[],"include":["refs/heads/main"]} and
          .repository_rulesets[0].rules == [{"type":"creation"},{"type":"update","parameters":{"update_allows_fetch_and_merge":false}},{"type":"deletion"}] and
          .repository_rulesets[1].name == "release-tags-samo-only" and
          .repository_rulesets[1].target == "tag" and
          .repository_rulesets[1].enforcement == "active" and
          .repository_rulesets[1].bypass_actors == [{"actor_id":280144521,"actor_type":"User","bypass_mode":"always"}] and
          .repository_rulesets[1].conditions.ref_name == {"exclude":[],"include":["refs/tags/v*"]} and
          .repository_rulesets[1].rules == [{"type":"creation"},{"type":"update","parameters":{"update_allows_fetch_and_merge":false}},{"type":"deletion"}] and
          .allow_force_pushes == false and .allow_deletions == false'
          config/main-branch-protection.json
      - name: Verify generated Worker binding types
        run: bun run check:worker-types
      - run: bun run test:all
      - run: shellcheck scripts/*.sh
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
      # High/critical advisories block merges.
      - run: bun audit --audit-level=high
