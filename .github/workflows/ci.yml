name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  policy-api-readability:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Prove policy guard API readability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "NikolayS/gitzette" ]]; then
            echo "policy API readability is canonical-repository-only; skipping fork"
            exit 0
          fi
          production_environment="$(gh api \
            "repos/$GITHUB_REPOSITORY/environments/production")"
          jq -e 'has("can_admins_bypass")' <<<"$production_environment" >/dev/null
          if [[ "$(jq -r .deployment_branch_policy.custom_branch_policies \
            <<<"$production_environment")" == true ]]; then
            gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies?per_page=1" >/dev/null
          fi
          environments="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/environments?per_page=100" |
            jq -c 'map(.environments) | add // []')"
          if jq -e 'any(.[]; .name == "credential-migration")' <<<"$environments" >/dev/null; then
            migration_environment="$(gh api \
              "repos/$GITHUB_REPOSITORY/environments/credential-migration")"
            jq -e 'has("can_admins_bypass")' <<<"$migration_environment" >/dev/null
            if [[ "$(jq -r .deployment_branch_policy.custom_branch_policies \
              <<<"$migration_environment")" == true ]]; then
              gh api "repos/$GITHUB_REPOSITORY/environments/credential-migration/deployment-branch-policies?per_page=1" >/dev/null
            fi
          fi

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install image validation runtime
        run: |
          set -euo pipefail
          # GitHub's Azure mirror can stall indefinitely; rewrite every apt source shape used by runner images.
          apt_source_list="$(mktemp)"
          trap 'rm -f "$apt_source_list"' EXIT
          sudo find /etc/apt -type f \( -name 'apt-mirrors.txt' -o -name 'sources.list' -o -name '*.sources' -o -name '*.list' \) -print0 |
            tee "$apt_source_list" >/dev/null
          mapfile -d '' -t apt_sources <"$apt_source_list"
          if [[ "${#apt_sources[@]}" -eq 0 ]]; then
            echo "no apt source files found" >&2
            exit 1
          fi
          for apt_source in "${apt_sources[@]}"; do
            sudo sed -Ei 's#https?://([a-z0-9.-]*\.)?azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$apt_source"
            if sudo grep -Eq 'https?://([a-z0-9.-]*\.)?azure\.archive\.ubuntu\.com/ubuntu' "$apt_source"; then
              echo "Azure Ubuntu mirror rewrite did not take effect in $apt_source" >&2
              exit 1
            else
              grep_status=$?
              if [[ "$grep_status" -ne 1 ]]; then
                echo "Azure Ubuntu mirror verification could not read $apt_source" >&2
                exit "$grep_status"
              fi
            fi
          done
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick=8:6.9.12.98+dfsg1-5.2build2 \
            imagemagick-6.q16=8:6.9.12.98+dfsg1-5.2build2
          sudo install -o root -g root -m 0644 runner/imagemagick/policy.xml /etc/ImageMagick-6/policy.xml
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify systemd Bun invocation flag
        run: bun --no-env-file --version
      - name: Validate protected-main policy definition
        run: bash scripts/check-branch-protection-policy-file.sh config/main-branch-protection.json
      - name: Verify generated Worker binding types
        run: bun run check:worker-types
      - run: bun run test:all
      - run: shellcheck scripts/*.sh
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
      # High/critical advisories block merges.
      - run: bun audit --audit-level=high
