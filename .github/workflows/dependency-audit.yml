name: Scheduled dependency audit

permissions:
  contents: read

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  # Keep dependency installation and auditing read-only. Issue writes happen
  # only in the separate, failure-gated `notify` job below.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile --ignore-scripts
      # A red weekly run means maintainers must triage moderate-or-higher findings.
      - run: bun audit --audit-level=moderate

  notify:
    if: ${{ always() && needs.audit.result == 'failure' }}
    needs: audit
    runs-on: ubuntu-24.04
    permissions:
      # The audit job remains read-only; only this failure notifier can write.
      issues: write
    steps:
      - name: Open or update dependency-audit issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scheduled dependency audit requires triage"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="The weekly moderate-or-higher dependency audit failed. Inspect run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
