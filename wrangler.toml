name = "gitzette"
main = "src/index.ts"
compatibility_date = "2024-11-01"
account_id = "a3265e0d0db71fdece29365819452f00"
compatibility_flags = ["nodejs_compat"]

[limits]
subrequest_limit = 1000

[triggers]
crons = ["17 13 * * 1"]

[[d1_databases]]
binding = "DB"
database_name = "gitzette-db"
database_id = "4a3624d7-7de8-46d5-91f5-7ee79856ccaa"

[[r2_buckets]]
binding = "DISPATCHES"
bucket_name = "gitzette-dispatches"

[vars]
ROLLING_7D_USER_GENERATION_LIMIT = "3"
ROLLING_7D_GLOBAL_GENERATION_LIMIT = "100"
MAX_QUEUE_AGE_SECONDS = "21600"
WEEKLY_GENERATION_ENABLED = "false"

# secrets (set via: wrangler secret put GITHUB_CLIENT_ID etc.)
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
# ADMIN_USER_ID      (rotatable immutable GitHub user ID for admin authorization)
# SESSION_SECRET
# STATUS_TOKEN       (rotatable Authorization bearer for the private operational dashboard)
# RUNNER_SECRET      (narrowly scoped pull-runner credential; not an AI key)
